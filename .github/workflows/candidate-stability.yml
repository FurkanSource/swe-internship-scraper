name: Candidate stability

on:
  schedule:
    - cron: "37 13 * * *"
    - cron: "47 14 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: Candidate observation type
        type: choice
        options: [daily, weekly]
        default: daily

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Select immutable candidate
        id: candidate
        run: python scripts/candidate_health.py --select
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.candidate.outputs.tag }}
          path: candidate
          persist-credentials: false
      - run: python -m pip install -e candidate
      - name: Observe candidate
        env:
          OBSERVATION_MODE: ${{ github.event.schedule == '47 14 * * 0' && 'weekly' || inputs.mode || 'daily' }}
        run: python scripts/candidate_health.py --checkout candidate
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/candidate-health/stability.json
          if-no-files-found: error
          retention-days: 30
