name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock -e .
      - run: python -m pip install -e plugins/icims --no-deps
      - run: ruff format --check src tests plugins scripts
      - run: ruff check src tests plugins scripts
      - run: python -m mypy
      - run: python -m coverage run -m unittest discover -s tests -p "test_*.py"
      - run: python -m coverage run --append -m unittest discover -s plugins/icims/tests -p "test_*.py"
      - run: python -m coverage report
      - run: pip-audit --strict -r requirements.txt
      - run: pip-audit --strict -r requirements-dev.lock

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: python -m unittest discover -s plugins/icims/tests -p "test_*.py"
      - run: python -m compileall -q src plugins/icims/src
      - run: swe-scraper providers --json

  distributions:
    name: Clean install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install build check-wheel-contents twine
      - run: python -m build --outdir dist
      - run: python -m build plugins/icims --outdir dist
      - run: python scripts/inspect_distribution.py dist
      - run: check-wheel-contents dist/*.whl
      - run: python -m twine check dist/*
      - run: python scripts/smoke_install.py dist
