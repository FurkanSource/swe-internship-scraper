name: Provider health

on:
  schedule:
    - cron: "17 11 * * *"
    - cron: "43 12 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: Health target set
        type: choice
        options: [daily, weekly]
        default: daily

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Run 18 daily canaries
        if: github.event.schedule != '43 12 * * 0' && inputs.mode != 'weekly'
        run: swe-scraper health --output provider-health.json --max-workers 12
      - name: Run weekly catalog rotation
        if: github.event.schedule == '43 12 * * 0' || inputs.mode == 'weekly'
        run: python scripts/weekly_health.py --per-provider 10 --output provider-health.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: provider-health-${{ github.run_id }}
          path: provider-health.json
          if-no-files-found: warn
          retention-days: 30
