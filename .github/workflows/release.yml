name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m build --outdir dist
      - run: python -m build plugins/icims --outdir dist
      - run: python scripts/inspect_distribution.py dist
      - run: check-wheel-contents dist/*.whl
      - run: python -m twine check dist/*
      - run: python scripts/smoke_install.py dist
      - run: cyclonedx-py requirements requirements.txt --output-file dist/sbom.cdx.json
      - run: python scripts/release_manifest.py dist
      - name: Prepare PyPI distributions
        run: |
          mkdir pypi-dist
          cp dist/*.whl dist/*.tar.gz pypi-dist/
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: "dist/*"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: pypi-dist/
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes
