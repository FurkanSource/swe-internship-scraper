name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m build --outdir dist
      - run: python -m build plugins/icims --outdir dist
      - run: python scripts/inspect_distribution.py dist
      - run: check-wheel-contents dist/*.whl
      - run: python -m twine check dist/*
      - run: python scripts/smoke_install.py dist
      - run: cyclonedx-py requirements requirements.txt --output-file dist/sbom.cdx.json
      - run: python scripts/release_manifest.py dist
      - name: Prepare PyPI distributions
        run: |
          mkdir pypi-dist
          cp dist/*.whl dist/*.tar.gz pypi-dist/
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - uses: pypa/gh-action-pypi-publish@a892a5a61159132606e93a2fa6f4358831b04d26 # v1.14.2
        with:
          packages-dir: pypi-dist/
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes
