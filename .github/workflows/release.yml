name: Release

on:
  push:
    tags: ["v*", "icims-v*"]
  workflow_dispatch:
    inputs:
      package:
        description: Package to build and attest without publishing
        type: choice
        options: [core, icims]
        default: core

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.select.outputs.package }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m build --outdir dist
      - run: python -m build plugins/icims --outdir dist
      - run: python scripts/inspect_distribution.py dist
      - run: check-wheel-contents dist/*.whl
      - run: python -m twine check dist/*
      - run: python scripts/smoke_install.py dist
      - name: Select release package and validate tag
        id: select
        env:
          RELEASE_PACKAGE: ${{ inputs.package || 'core' }}
        run: python scripts/prepare_release.py dist release-dist --package "$RELEASE_PACKAGE"
      - name: Generate installed-package SBOM
        run: |
          python -m venv .sbom-venv
          .sbom-venv/bin/python -m pip install --no-input release-dist/*.whl
          cyclonedx-py environment .sbom-venv/bin/python --output-file release-dist/sbom.cdx.json
      - run: python scripts/release_manifest.py release-dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.ref_name }}
          path: release-dist/
          if-no-files-found: error
          retention-days: 30

  provenance:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-${{ github.ref_name }}
          path: dist/
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

  publish-pypi:
    needs: [build, provenance]
    if: github.event_name == 'push' && needs.build.outputs.package == 'core'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-${{ github.ref_name }}
          path: dist/
      - name: Prepare core PyPI distributions
        run: |
          mkdir pypi-dist
          cp dist/swe_internship_scraper-*.whl dist/swe_internship_scraper-*.tar.gz pypi-dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: pypi-dist/

  publish-icims:
    needs: [build, provenance]
    if: github.event_name == 'push' && needs.build.outputs.package == 'icims'
    runs-on: ubuntu-latest
    environment: pypi-icims
    permissions:
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-${{ github.ref_name }}
          path: dist/
      - name: Prepare iCIMS PyPI distributions
        run: |
          mkdir pypi-dist
          cp dist/swe_scraper_icims-*.whl dist/swe_scraper_icims-*.tar.gz pypi-dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: pypi-dist/

  publish-github:
    needs: [build, provenance, publish-pypi, publish-icims]
    if: >-
      always() && github.event_name == 'push' &&
      needs.build.result == 'success' && needs.provenance.result == 'success' &&
      ((needs.build.outputs.package == 'core' && needs.publish-pypi.result == 'success') ||
       (needs.build.outputs.package == 'icims' && needs.publish-icims.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-${{ github.ref_name }}
          path: dist/
      - name: Publish GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=()
          if [[ "${GITHUB_REF_NAME}" =~ (a|b|rc)[0-9]+ ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes "${release_flags[@]}"
